  --bg:#FBF9EA; --surface:#FFFFFF; --ink:#12302A; --muted:#557268; --line:#E2E6CC; --soft:#E5F4EC; --lemon:#FFF1A8;
  --accent:#0F7968; --accent-ink:#FFFFFF; --hero:#0F7968; --hero-ink:#FFFFFF; --hero-sub:#E8F6F1; --hero-btn:#FFE766; --hero-btn-ink:#12302A; --mark:#FFE766; --warn:#B07A00;
  --good:#1E7A4F; --good-bg:#DDF3E8; --bad:#B3261E; --bad-bg:#FBE3E1;
  --f-head:'S-Core Dream','SCoreDream','S-CoreDream','에스코어드림','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'S-Core Dream','SCoreDream','S-CoreDream','에스코어드림','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-deco:'Cafe24 Shiningstar','S-Core Dream','SCoreDream','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'S-Core Dream','SCoreDream','S-CoreDream','에스코어드림','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1916; --surface:#16251F; --ink:#EAF4EE; --muted:#9DB8AD; --line:#28403A; --soft:#1C3B33; --lemon:#4A4310;
    --accent:#6FD3B6; --accent-ink:#08201A; --hero:#1E5A4B; --hero-ink:#EAF4EE; --hero-sub:#CDE5DB; --hero-btn:#FFE766; --hero-btn-ink:#12302A; --mark:#5A4F0E; --warn:#F2C14E;
    --good:#7BDDA9; --good-bg:#14382B; --bad:#FF8E86; --bad-bg:#3C1B19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#16251F; --ink:#EAF4EE; --muted:#9DB8AD; --line:#28403A; --soft:#1C3B33; --lemon:#4A4310;
  --accent:#6FD3B6; --accent-ink:#08201A; --hero:#1E5A4B; --hero-ink:#EAF4EE; --hero-sub:#CDE5DB; --hero-btn:#FFE766; --hero-btn-ink:#12302A; --mark:#5A4F0E; --warn:#F2C14E;
  --good:#7BDDA9; --good-bg:#14382B; --bad:#FF8E86; --bad-bg:#3C1B19; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:12px calc(112px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-deco);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand i{font-style:normal;font-weight:500;color:var(--accent)}
.pill{min-height:40px;padding:0 14px;border-radius:999px;background:var(--soft);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.pill span{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.link{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:32px}

.daybar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px}
.daymid{text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}
.dn{font-family:var(--f-deco);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.02em}
.dsub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.seg{height:10px;border-radius:5px;background:var(--line);position:relative}
.seg.k{background:var(--accent)}
.seg.u{background:var(--warn)}
.seg.cur{outline:2px solid var(--ink);outline-offset:2px}
.segwrap{display:flex;flex-direction:column;gap:8px}
.segmeta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.cardtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icons{display:flex;gap:4px}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib:active{background:var(--soft)}
.ib svg{width:22px;height:22px}
.head{font-family:var(--f-deco);font-weight:700;font-size:clamp(34px,11vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.head.sm{font-size:30px}
.pos{font-family:var(--f-head);color:var(--muted);font-size:16px;margin:-6px 0 0}
.ko{font-size:24px;font-weight:700;margin:0}
.def{margin:0}
.ex{margin:0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted);font-family:var(--f-head);font-size:17px;line-height:1.5}
.ox{font-size:14px}
.tr{margin:-6px 0 0;padding-left:15px;color:var(--muted);font-size:15px;line-height:1.5}
.reveal{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px dashed var(--line)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:52px;border-radius:14px;font-weight:700;padding:0 16px;display:flex;align-items:center;justify-content:center;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.out{border:1.5px solid var(--line);color:var(--ink)}
.btn.full{grid-column:1/-1}

.banner{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.banner p{margin:0;font-weight:500}
.info{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:15px}
.info b{font-weight:700}

.sect{display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;min-height:52px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.cur{background:var(--lemon)}
.row.two{grid-template-columns:minmax(0,1fr) auto}
.row.hd{background:var(--soft);min-height:40px;padding-block:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.k{background:var(--accent)}.dot.u{background:var(--warn)}
.rw{font-family:var(--f-deco);font-weight:700;font-size:19px;overflow-wrap:anywhere}
.rk{color:var(--muted);font-size:15px;text-align:right;max-width:46vw;overflow-wrap:anywhere}
.rk.hid{filter:blur(6px);user-select:none}
.note{font-size:13px;color:var(--muted);margin:0}

.qtype{display:inline-flex;align-self:flex-start;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent);background:var(--soft);border-radius:999px;padding:4px 10px}
.qdef{font-family:var(--f-head);font-size:21px;line-height:1.45;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px}
.opt .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);width:18px;flex:none}
.opt .t{min-width:0;overflow-wrap:anywhere;font-size:17px}
.opt .t.serif{font-family:var(--f-head);font-weight:700;font-size:20px}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-bg)}.fb.bad{background:var(--bad-bg)}
.fb .ex{border-color:currentColor}
.score{font-family:var(--f-head);font-weight:700;font-size:72px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score small{font-size:28px;color:var(--muted);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;width:64px}
.bar span{display:block;height:100%;background:var(--accent)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.rrow .d{font-size:14px;line-height:1.35}
.rrow .d small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rrow .s{font-family:var(--f-mono);font-size:14px;width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.empty{padding:20px 16px;color:var(--muted);text-align:center}

.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;text-align:center;line-height:1.3}
.cell b{font-family:var(--f-mono);font-size:14px}
.cell small{color:var(--muted);font-size:11px}
.cell.test{background:var(--lemon)}
.cell.view{border-color:var(--accent)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell .ck{color:var(--good);font-weight:700;font-size:13px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sw button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:700}
.sw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type="date"]{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:0 12px;width:100%}
.chk{display:flex;align-items:center;gap:12px;min-height:46px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.steps{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.steps li{padding-left:12px;border-left:3px solid var(--line);display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.5}
.steps li b{color:var(--accent)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{min-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--soft)}

.btn.spk{min-height:44px;gap:8px;align-self:flex-start;padding:0 16px;font-size:15px}
.btn.spk svg{width:20px;height:20px}
@keyframes fxin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.reveal{animation:fxin .2s ease-out}}

.dn{font-size:24px}
.dn small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.dsub{font-size:12px}
.chipn{margin-top:4px;font-size:12px;background:var(--lemon);border-radius:999px;padding:2px 10px;color:var(--ink)}
.chip{display:flex;align-items:center;gap:8px;align-self:flex-start;min-height:36px;padding:0 6px 0 4px;border-radius:999px;background:var(--soft);font-size:13px;color:var(--ink)}
.chip b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px;font-weight:700}
.chip i{font-style:normal;color:var(--muted);font-size:12px;padding-right:8px}
.info{font-size:14px}
.pos{display:inline-flex;align-self:flex-start;margin:-4px 0 0;padding:2px 11px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700}
.ko{font-size:25px;line-height:1.3}
.reveal>.def{font-size:15px;color:var(--muted)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:start}
.exrow .ib{width:40px;height:40px;color:var(--accent);background:var(--soft);border-radius:50%}
.exrow .ib svg{width:20px;height:20px}
.exrow .ex{color:var(--ink)}
.tr{font-size:14px}
.reveal .ox{font-size:12px;color:var(--muted);align-self:flex-start}
.segwrap{gap:6px}
.btns.stk{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:2;background:var(--surface);padding-top:10px;box-shadow:0 -10px 12px -6px var(--surface)}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:var(--hero-btn);opacity:.2}
.hero .hl{font-size:13px;color:var(--hero-sub)}
.hero h1{margin:0;font-family:var(--f-deco);font-size:44px;line-height:1.05;letter-spacing:-.02em}
.hero p{margin:0;font-size:14px;color:var(--hero-sub)}
.hero .hw{align-self:flex-start;margin-top:8px;background:rgba(0,30,22,.3);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.hero .hbtn{margin-top:14px;min-height:52px;border-radius:14px;background:var(--hero-btn);color:var(--hero-btn-ink);font-weight:800;font-size:16px;position:relative;z-index:1}
.hblk{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hhead{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 16px}
.ht b{font-size:16px}.ht small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.hp{display:flex;align-items:center;gap:8px}.hp small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.pbar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px;min-height:60px;border-top:1px solid var(--line)}
.hrow.today{background:var(--lemon)}
.hrow .d{font-size:15px;font-weight:700;line-height:1.35}
.hrow .d em{font-style:normal;font-size:11px;font-weight:800;background:var(--hero);color:var(--hero-ink);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.hrow .d small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.hrow.past .d,.hrow.done .d{color:var(--muted)}
.si{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--muted)}
.si svg{width:16px;height:16px}
.si.done{background:var(--good);border-color:var(--good);color:#fff}
.si.today{border-color:var(--hero);background:var(--surface);box-shadow:inset 0 0 0 5px var(--lemon)}
.si.test{background:var(--lemon);border-color:var(--warn);color:var(--ink)}
.pl{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pl.lem{background:var(--lemon);color:var(--ink)}

.stats3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;min-width:0}
.mini b{display:block;font-size:15px;line-height:1.2}
.mini small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.mini .big{font-family:var(--f-head);font-size:28px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-.02em}
.mini .ring{flex:none}

/* 세부 정리: 간격 4·8·12·16·20, 버튼은 주(채움)·보조(연한 채움)·텍스트 3단계, 터치 영역 44px 이상 */
.btn{font-size:16px;letter-spacing:-.01em}
.btn.pri{box-shadow:0 2px 0 rgba(18,48,42,.18)}
.btn.sec{color:var(--accent)}
.btn:active,.hbtn:active,.opt:active{transform:scale(.985)}
@media (hover:hover){.btn.pri:hover{filter:brightness(1.06)}.btn.sec:hover{filter:brightness(.97)}.hrow:hover,.row:hover{background:var(--soft)}}
.ib{width:44px;height:44px}
.pos{font-size:14px;padding:3px 12px}
.seg{height:8px}
.label{font-size:12px;letter-spacing:.04em}
.sechead .label{font-weight:700;color:var(--muted)}
.card{gap:16px}
.reveal{gap:14px}
.note{line-height:1.5}

.rwrap{position:relative;display:inline-grid;place-items:center;flex:none}
.rwrap .ring{position:absolute;inset:0;width:100%;height:100%}
.rctr{position:relative;font-family:var(--f-head);font-weight:700;line-height:1;text-align:center}
.rctr small{font-size:.55em;color:var(--muted);font-weight:500}
.cele{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--lemon);border-radius:18px;padding:14px 16px}
.cele .ct b{display:block;font-size:16px}.cele .ct span{font-size:13px;color:var(--muted)}
.cele .btn{min-height:44px;padding:0 16px}
.cele .rctr{font-size:20px}
.resbox{display:flex;align-items:center;gap:18px}
.resbox .rctr{font-size:34px}
.rmsg{margin:0 0 4px;font-size:18px;font-weight:700;line-height:1.4}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:0}
@keyframes rfill{from{stroke-dashoffset:var(--c)}}
@keyframes cfall{0%{opacity:1;transform:translateY(0) rotate(var(--r))}100%{opacity:0;transform:translateY(340px) rotate(calc(var(--r) + 540deg))}}
@keyframes cpop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){
  .ring.anim circle:nth-child(2){animation:rfill .9s ease-out}
  .confetti i{animation-name:cfall;animation-timing-function:ease-in;animation-fill-mode:forwards}
  .cele.pop,.card.pop{animation:cpop .45s ease-out}
}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.fb .ex,.fb .tr{color:var(--ink)}
.fb mark{color:var(--ink)}

/* 학습 화면 정리: 세트 칩은 조용하게, 외움/아직은 색 + 모양 + 글자로 */
.chip{background:none;min-height:32px;padding:0;gap:6px;color:var(--muted);font-size:13px}
.chip b{background:none;color:var(--ink);padding:0;font-weight:700}
.chip span::before{content:"·";margin-right:6px}
.chip i{padding:0;font-size:11px}
.segmeta{font-size:12px;justify-content:flex-start}
.seg.u{background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 6px),var(--line)}
.dot{width:22px;height:22px;display:grid;place-items:center;background:none;border:2px solid var(--line);color:#fff}
.dot svg{width:13px;height:13px}
.dot.k{background:var(--accent);border-color:var(--accent)}
.dot.u{background:var(--lemon);border-color:var(--warn);color:var(--ink)}
.btn.out{background:none;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btns.stk{grid-template-columns:1fr 1.5fr}
.head.sm,.def,.rmsg,.cele .ct b,.steps li{word-break:keep-all}
[hidden]{display:none!important}

.wordrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wordrow .head{min-width:0}
.btns.stk{grid-template-columns:1fr 1fr}
.btns.stk .btn{font-size:15px;padding:0 8px;min-height:48px;white-space:nowrap}
/* 태블릿·데스크톱: 폭을 넓히고 글자와 여백을 키운다 */
@media (min-width:700px){
  body{padding-inline:32px;padding-block-start:24px;font-size:17px}
  .app{max-width:720px;gap:20px}
  .tabs div{max-width:720px}
  .tab{min-height:62px;font-size:13px}
  .brand{font-size:26px}
  .card{padding:28px;border-radius:22px;box-shadow:0 1px 2px rgba(18,48,42,.05),0 8px 28px rgba(18,48,42,.06)}
  .list,.hblk{box-shadow:0 1px 2px rgba(18,48,42,.04),0 6px 20px rgba(18,48,42,.05)}
  .head{font-size:clamp(46px,7vw,60px)}
  .head.sm{font-size:36px}
  .ko{font-size:29px}
  .ex{font-size:19px}
  .def,.tr{font-size:17px}
  .dn{font-size:28px}
  .row,.hrow{padding:14px 20px;min-height:58px}
  .cell{min-height:104px;font-size:13px}
  .btn{min-height:56px}
}
@media (min-width:1000px){
  body{padding-block-start:36px}
  .app{max-width:760px}
  .tabs div{max-width:760px}
}
@media (prefers-color-scheme:dark){.card{box-shadow:none}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.ib{transition:background .15s,border-color .15s}}

const OLD=RAW.map(r=>({w:r[0],pos:r[1],ko:r[2],def:r[3],ex:r[4],tr:r[5],lvl:''}));
const NEW=NEWRAW.map(r=>({w:r[0],pos:r[1],ko:r[2],def:r[3],ex:r[4],tr:r[5],lvl:r[6]}));
const ALL=NEW.concat(OLD);

/* 고정 시드로 한 번 섞은 뒤 10개씩 세트로 자른다. 두 사람의 기기에서 세트 구성이 같다. */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(n,seed){const R=rng(seed),a=[];for(let i=0;i<n;i++)a.push(i);for(let i=n-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const NEWN=NEW.length;
const ORDER=Array.from({length:NEWN/20},(_,b)=>shuf(20,20261006+b).map(i=>i+b*20)).reduce((a,x)=>a.concat(x),[]).concat(shuf(OLD.length,20261005).map(i=>i+NEWN));
/* 세트는 ORDER 순서대로 10개씩 자른다. 새 단어(Oxford 3000)가 앞에, 기존 단어 240개가 뒤에 온다. 2주(8세트)마다 80개씩 쓰고, 전부 쓰면 처음으로 돌아간다. */
const NSETS=ORDER.length/10;
const setWords=s=>{s=((s%NSETS)+NSETS)%NSETS;return ORDER.slice(s*10,s*10+10).map(i=>ALL[i])};

const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const DOW=['일','월','화','수','목','금','토'];
const dLong=d=>(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일';
const dShort=d=>(d.getMonth()+1)+'/'+d.getDate()+' '+DOW[d.getDay()];

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const hl=(ex,w)=>{const st=w.slice(0,Math.max(4,w.length-2));return esc(ex).replace(new RegExp('\\b('+st+'\\w*)','i'),'<mark>$1</mark>')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const isRest=d=>DB.cfg.weekdays&&(d.getDay()===0||d.getDay()===6);
function indexOfDate(d){
  const s=parseKey(DB.cfg.start),t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  let n=-1;
  for(const x=new Date(s);x<=t;x.setDate(x.getDate()+1)){if(!isRest(x))n++}
  return Math.max(0,n);
}
function dateOfN(n){
  const x=parseKey(DB.cfg.start);let c=-1;
  for(let g=0;g<5000;g++){if(!isRest(x)){c++;if(c===n)break}x.setDate(x.getDate()+1)}
  return x;
}

/* ---------- 루틴 ----------
   한 회차 = 10일. 1~4일차 세트 1~4, 6~9일차 세트 5~8.
   언니/동생은 같은 쌍의 두 세트를 하루씩 번갈아 외운다. 5일차는 40단어, 10일차는 80단어 복습. */
function plan(n,role){
  const c=Math.floor(n/10),d=n%10+1,pos=(d-1)%5,blk=d<=5?0:1;
  const setOf=k=>(c*8+k)%NSETS;
  const fin=r=>{r.day=n+1;r.wait=(r.type==='test'?r.sets:[r.set]).some(x=>setWords(x).length<10);return r};
  if(pos===4){
    const ks=blk===0?[0,1,2,3]:[0,1,2,3,4,5,6,7];
    return fin({c:c,d:d,type:'test',ks:ks,sets:ks.map(setOf)});
  }
  const k0=blk*4+(pos>>1)*2,k1=k0+1,first=pos%2===0;
  const mineK=((role==='unni')===first)?k0:k1;
  return fin({c:c,d:d,type:'learn',pos:pos,mineK:mineK,otherK:mineK===k0?k1:k0,set:setOf(mineK)});
}
const poolOf=p=>p.type==='test'?p.sets.reduce((a,s)=>a.concat(setWords(s)),[]):setWords(p.set);
const isDone=(u,n)=>!!u.hist[n]||!!(u.known[n]&&Object.keys(u.known[n]).length>=10);
function ring(v,max,px,center){
  const r=18,C=2*Math.PI*r,off=C*(1-Math.min(v,max)/max);
  const svg='<svg class="ring'+(S.pop?' anim':'')+'" width="'+px+'" height="'+px+'" viewBox="0 0 44 44" aria-hidden="true" style="--c:'+C.toFixed(1)+'"><circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 22 22)"/></svg>';
  return center?'<span class="rwrap" style="width:'+px+'px;height:'+px+'px">'+svg+'<span class="rctr">'+center+'</span></span>':svg;
}
function confetti(){
  const cols=['#FFE766','#12806F','#7FD1B9','#FFB84D','#FFFFFF'];
  let h='<div class="confetti" aria-hidden="true">';
  for(let i=0;i<22;i++)h+='<i style="left:'+(4+i*4.3)+'%;background:'+cols[i%5]+';animation-delay:'+((i*53)%420)+'ms;animation-duration:'+(1300+(i*97)%700)+'ms;--r:'+((i*47)%360)+'deg"></i>';
  return h+'</div>';
}
function streak(){
  const u=U(),t=todayN();let n=isDone(u,t)?t:t-1,c=0;
  while(n>=0&&isDone(u,n)){c++;n--}
  return c;
}

  if(S.nospeak)h+='<p class="note" role="status">이 화면에서는 소리를 낼 수 없어요. Safari나 Chrome 앱에서 직접 열어 보세요.</p>';

  }else{
    h+='<p class="note">먼저 뜻을 떠올려 보고, 눌러서 확인하세요.</p><div class="btns stk"><button class="btn pri full" data-a="reveal">뜻 보기</button></div>';
  }

/* ---------- 테스트 ---------- */
function makeOpts(w){
  const pool=ALL.filter(x=>x.w!==w.w);
  const d=shuffle(pool.filter(x=>x.pos===w.pos)).concat(shuffle(pool.filter(x=>x.pos!==w.pos))).slice(0,3);
  return shuffle([w].concat(d));
}
function startQuiz(pool,count,retry){
  const qs=shuffle(pool).slice(0,count).map(w=>({w:w,type:'ko',opts:makeOpts(w)}));
  S.quiz={qs:qs,i:0,ans:[],picked:null,done:false,retry:!!retry};
}
function testView(){
  const p=plan(S.n,DB.me),q=S.quiz,u=U();
  if(p.wait)return waitView(p);
  if(!q){
    const pool=poolOf(p),hs=u.hist[S.n];
    let h='<section class="card"><span class="label">'+p.day+'일차 · '+(p.type==='test'?'복습 테스트':'오늘 단어 테스트')+'</span>';
    h+='<h1 class="head sm">'+(p.type==='test'?'세트 '+(p.ks[0]+1)+'~'+(p.ks[p.ks.length-1]+1)+' · '+pool.length+'단어':'세트 '+(p.mineK+1)+' · 10문제')+'</h1>';
    h+='<p class="def">영어 단어를 보고 알맞은 한국어 뜻을 고르는 문제예요.</p>';
    if(hs)h+='<p class="note">이 날의 최고 기록 '+hs.ok+'/'+hs.total+' · '+hs.tries+'회 응시</p>';
    h+='<div class="btns">';
    if(p.type==='test')h+='<button class="btn sec" data-a="start" data-v="20">20문제만</button><button class="btn pri" data-a="start" data-v="'+pool.length+'">전체 '+pool.length+'문제</button>';
    else h+='<button class="btn pri full" data-a="start" data-v="10">시작하기</button>';
    return h+'</div></section>';
  }
  if(q.done){
    const n=q.qs.length,ok=q.ans.filter(a=>a.ok).length,wrong=q.ans.filter(a=>!a.ok);
    const r=ok/n;
    const msg=r===1?'전부 맞혔어요.':r>=.8?'거의 다 외웠어요.':r>=.5?'절반을 넘었어요. 틀린 단어만 한 번 더 봐요.':'아직 낯설어요. 목록을 다시 훑어보고 도전해 보세요.';
    const pop=S.pop==='quiz'&&r>=.8;
    let h='<section class="card'+(pop?' pop':'')+'">'+(pop?confetti():'')+'<span class="label">'+(q.retry?'틀린 단어 다시 풀기':'결과')+'</span>'+'<div class="resbox">'+ring(ok,n,104,'<b>'+ok+'</b><small>/'+n+'</small>')+'<div><p class="rmsg">'+msg+'</p><p class="note">연속 '+streak()+'일째 학습 중</p></div></div>';
    if(wrong.length){
      h+='<div class="reveal"><span class="label">틀린 단어 '+wrong.length+'개</span>'+wrong.map(a=>'<div><b class="rw">'+esc(a.w.w)+'</b> <span class="note">'+esc(a.w.pos)+'</span><br><span>'+esc(a.w.ko)+'</span></div>').join('')+'</div>';
    }
    h+='<div class="btns">';
    if(wrong.length)h+='<button class="btn sec" data-a="retrywrong">틀린 것만 다시</button>';
    h+='<button class="btn '+(wrong.length?'out':'sec')+'" data-a="restart">처음부터 다시</button><button class="btn pri full" data-a="gotolearn">학습으로 돌아가기</button></div></section>';
    return h;
  }
  const cur=q.qs[q.i],n=q.qs.length,answered=q.picked!==null,okSoFar=q.ans.filter(a=>a.ok).length;
  const prog=n<=12?'<div class="segs" style="grid-template-columns:repeat('+n+',1fr)">'+q.qs.map((_,i)=>'<span class="seg '+(i<q.ans.length?(q.ans[i].ok?'k':'u'):'')+(i===q.i?' cur':'')+'"></span>').join('')+'</div>':'<div class="pbar"><span style="width:'+(q.ans.length/n*100)+'%"></span></div>';
  let h='<div class="segwrap" style="margin-bottom:16px">'+prog+'<div class="segmeta"><span>문제 '+(q.i+1)+'/'+n+'</span><span>맞힘 '+okSoFar+'</span></div></div>';
  h+='<section class="card"><span class="qtype">'+(cur.type==='ko'?'뜻 고르기':'단어 고르기')+'</span>';
  if(cur.type==='ko')h+='<h1 class="head">'+esc(cur.w.w)+'</h1><p class="pos">'+esc(cur.w.pos)+'</p>';
  else h+='<p class="qdef">'+esc(cur.w.def)+'</p><p class="pos">'+esc(cur.w.pos)+'</p>';
  h+='<div class="opts">'+cur.opts.map((o,i)=>{
    let c='opt';
    if(answered){if(o.w===cur.w.w)c+=' correct';else if(i===q.picked)c+=' wrong';else c+=' dim'}
    return '<button class="'+c+'" data-a="pick" data-v="'+i+'"'+(answered?' disabled':'')+'><span class="n">'+(i+1)+'</span><span class="t'+(cur.type==='def'?' serif':'')+'">'+esc(cur.type==='ko'?o.ko:o.w)+'</span></button>';
  }).join('')+'</div>';
  if(answered){
    const ok=cur.opts[q.picked].w===cur.w.w;
    h+='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'정답이에요':'아쉬워요')+'</b><span><b>'+esc(cur.w.w)+'</b> · '+esc(cur.w.ko)+'</span><p class="ex">'+hl(cur.w.ex,cur.w.w)+'</p><p class="tr">'+esc(cur.w.tr)+'</p></div>';
    h+='<div class="btns"><button class="btn pri full" data-a="qnext">'+(q.i===n-1?'결과 보기':'다음 문제')+'</button></div>';
  }
  return h+'</section>';
}
function finishQuiz(){
  const q=S.quiz,u=U();q.done=true;S.pop='quiz';
  if(!q.retry){
    const ok=q.ans.filter(a=>a.ok).length,total=q.qs.length,p=u.hist[S.n];
    const better=!p||(ok/total>p.ok/p.total);
    u.hist[S.n]={ok:better?ok:p.ok,total:better?total:p.total,tries:(p?p.tries:0)+1};
    save();
  }
}

function recView(){
  const u=U(),tn=todayN(),hs=Object.keys(u.hist).map(k=>u.hist[k]);
  const avg=hs.length?Math.round(hs.reduce((s,x)=>s+x.ok/x.total,0)/hs.length*100):null;
  const doneDays=Object.keys(u.hist).length?new Set(Object.keys(u.hist).concat(Object.keys(u.known).filter(k=>isDone(u,+k)))).size:Object.keys(u.known).filter(k=>isDone(u,+k)).length;
  let h='<div class="sect"><div class="stats"><div class="stat"><span class="label">연속</span><b>'+streak()+'일</b></div><div class="stat"><span class="label">완료한 날</span><b>'+doneDays+'</b></div><div class="stat"><span class="label">평균 정답</span><b>'+(avg===null?'-':avg+'%')+'</b></div></div>';
  h+='<div class="sechead"><span class="label">최근 10일 · '+ROLES[DB.me]+'</span></div><div class="list">';
  for(let i=0;i<10&&tn-i>=0;i++){
    const n=tn-i,p=plan(n,DB.me),r=u.hist[n];
    h+='<button class="row two" data-a="open" data-v="'+n+'"><span class="rrow"><span class="d">'+wk(Math.floor(n/10))+' '+p.day+'일차'+(p.type==='test'?' · 복습':'')+'<small>'+dShort(dateOfN(n))+(i===0?' · 오늘':'')+'</small></span><span class="bar"><span style="width:'+(r?Math.round(r.ok/r.total*100):0)+'%"></span></span><span class="s">'+(r?r.ok+'/'+r.total:(isDone(u,n)?'학습':'-'))+'</span></span><span class="note">'+ICON.next.replace('<svg','<svg width="18" height="18"')+'</span></button>';
  }
  h+='</div>';
  const miss=Object.keys(u.miss).filter(w=>u.miss[w]>0).sort((a,b)=>u.miss[b]-u.miss[a]).slice(0,10).map(w=>ALL.find(x=>x.w===w)).filter(Boolean);
  h+='<div class="sechead"><span class="label">자주 틀리는 단어</span></div>';
  if(miss.length)h+='<div class="list">'+miss.map(x=>'<div class="row two"><span class="rw">'+esc(x.w)+'</span><span class="rk">'+esc(x.ko)+'</span></div>').join('')+'</div>';
  else h+='<div class="list"><div class="empty">아직 기록이 없어요. 테스트에서 틀린 단어가 여기에 모여요.</div></div>';
  h+='<p class="note">기록은 이 기기의 브라우저에만 저장돼요.</p></div>';
  return h;
}

/* ---------- 렌더 & 이벤트 ---------- */
/* 화면 갱신: 바뀐 부분만 고쳐서 포커스와 스크롤, 입력값을 유지한다 */
function syncAttrs(x,y){
  for(const a of [...x.attributes])if(!y.hasAttribute(a.name))x.removeAttribute(a.name);
  for(const a of [...y.attributes])if(x.getAttribute(a.name)!==a.value)x.setAttribute(a.name,a.value);
}
function syncKids(a,b){
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){
    const x=ac[i],y=bc[i];
    if(!x){a.appendChild(y.cloneNode(true));continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue}
    if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    syncAttrs(x,y);
    if(x.nodeName==='INPUT'){
      if(x!==document.activeElement){if(x.type==='checkbox')x.checked=y.hasAttribute('checked');else x.value=y.getAttribute('value')||''}
    }else syncKids(x,y);
  }
  while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);
}
function paint(el,html){const t=document.createElement('template');t.innerHTML=html;syncKids(el,t.content)}
function render(){
  const has=!!DB.me,rb=document.getElementById('rolebtn'),tabs=document.getElementById('tabs'),bar=document.getElementById('daybar');
  rb.hidden=!has;tabs.hidden=!has;
  if(!has){paint(bar,'');paint(document.getElementById('view'),welcomeView());return}
  rb.innerHTML=ROLES[DB.me]+' <span>바꾸기</span>';
  const p=plan(S.n,DB.me),tn=todayN(),dt=dateOfN(S.n);
  const rest=S.n===tn&&isRest(new Date());
  const sd=parseKey(DB.cfg.start),now=new Date(),before=new Date(now.getFullYear(),now.getMonth(),now.getDate())<sd;
  if(S.tab==='home'){paint(bar,'');paint(document.getElementById('view'),homeView());document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.v===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});return}
  paint(bar,'<div class="daybar"><button class="ib" data-a="dayprev" aria-label="전날"'+(S.n===0?' disabled style="opacity:.3"':'')+'>'+ICON.prev+'</button>'+
    '<div class="daymid"><span class="dn">'+p.day+'일차 <small>'+dShort(dt)+'</small></span><span class="dsub">'+wk(p.c)+' · '+(p.type==='test'?'복습 테스트':'학습')+'</span>'+
    (rest?'<span class="dsub">주말이라 금요일 내용을 복습하는 중이에요</span>':'')+
    (before?'<span class="chipn">'+(sd.getMonth()+1)+'월 '+sd.getDate()+'일 시작 · 미리 보는 중</span>':'')+
    (S.n!==tn?'<button class="link" data-a="today">오늘로</button>':'')+'</div>'+
    '<button class="ib" data-a="daynext" aria-label="다음날">'+ICON.next+'</button></div>');
  paint(document.getElementById('view'),S.tab==='home'?homeView():S.tab==='learn'?learnView():S.tab==='test'?testView():recView());
  S.fx=null;S.pop=null;
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.v===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
function act(a,v){
  const ws=DB.me?(()=>{const p=plan(S.n,DB.me);return p.type==='learn'?setWords(p.set):[]})():[];
  switch(a){
    case 'role':DB.me=v;save();goN(todayN());S.tab='home';break;
    case 'swaprole':case 'setrole':DB.me=a==='swaprole'?otherRole(DB.me):v;save();S.idx=0;S.revealed=false;S.quiz=null;break;
    case 'tab':S.tab=v;break;
    case 'dayprev':goN(S.n-1);break;
    case 'daynext':goN(S.n+1);break;
    case 'today':goN(todayN());break;
    case 'open':goN(+v);S.tab='learn';break;
    case 'hblk':S.hopen[v]=S.hopen[v]?0:1;break;
    case 'hmore':S.hmax=Math.max(S.hmax,Math.floor(todayN()/10)+1,4)+1;S.hopen[S.hmax-1]=1;break;
    case 'reveal':S.revealed=true;break;
    case 'go':S.fx=(+v>=S.idx)?'l':'r';S.idx=+v;S.revealed=false;break;
    case 'prev':S.fx='r';S.idx=(S.idx+9)%10;S.revealed=false;break;
    case 'next':S.fx='l';S.idx=(S.idx+1)%10;S.revealed=false;break;
    case 'mark':{const k=U().known[S.n]||(U().known[S.n]={});const was=Object.keys(k).length;k[ws[S.idx].w]=+v;save();if(was<10&&Object.keys(k).length>=10)S.pop='learn';if(S.idx<9){S.idx++;S.fx='l'}S.revealed=false;break}
    case 'speak':if(!canSpeak){S.nospeak=true;break}if(ws[S.idx])speak(ws[S.idx].w);return;
    case 'speakex':if(!canSpeak){S.nospeak=true;break}if(ws[S.idx])speak(ws[S.idx].ex);return;
    case 'setinfo':S.info=!S.info;break;
    case 'hideko':S.hideKo=!S.hideKo;break;
    case 'gotest':S.tab='test';S.quiz=null;break;
    case 'gotolearn':S.tab='learn';S.quiz=null;break;
    case 'start':startQuiz(poolOf(plan(S.n,DB.me)),+v||10,false);break;
    case 'restart':S.quiz=null;break;
    case 'retrywrong':{const w=S.quiz.ans.filter(x=>!x.ok).map(x=>x.w);startQuiz(w,w.length,true);break}
    case 'pick':{
      const q=S.quiz;if(q.picked!==null)return;
      const cur=q.qs[q.i],ok=cur.opts[+v].w===cur.w.w,m=U().miss;
      q.picked=+v;q.ans.push({w:cur.w,ok:ok});
      if(ok){if(m[cur.w.w]>0)m[cur.w.w]--}else m[cur.w.w]=(m[cur.w.w]||0)+1;
      save();break;
    }
    case 'qnext':{const q=S.quiz;if(q.i===q.qs.length-1)finishQuiz();else{q.i++;q.picked=null}break}
  }
  render();
  if(['go','open','tab','gotest','gotolearn','dayprev','daynext','today','restart','start'].indexOf(a)>=0)window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='startdate'&&t.value){DB.cfg.start=t.value;DB.cfg.custom=true;save();goN(todayN());render()}
  if(t.id==='wk'){DB.cfg.weekdays=t.checked;save();goN(todayN());render()}
});
goN(todayN());
render();
</script>
